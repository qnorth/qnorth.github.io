<style>
    :root {
        --width: 720px;
        --font-main: Verdana, sans-serif;
        --font-secondary: Verdana, sans-serif;
        --font-scale: 1em;
        --background-color: #fbfbfb;
        --heading-color: #222;
        --text-color: #444;
        --link-color: #b39741;
        --visited-color: #8b6fcb;
        --blockquote-color: #222;
        --code-color: #e9e9e9;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --background-color: #01242e;
            --heading-color: #eee;
            --text-color: #ddd;
            --link-color: #8cc2dd;
            --visited-color: #8b6fcb;
            --blockquote-color: #ccc;
        }
    }

    body {
        font-family: var(--font-secondary), sans-serif;
        font-size: var(--font-scale);
        margin: auto;
        padding: 20px;
        max-width: var(--width);
        text-align: justify;
        background-color: var(--background-color);
        word-wrap: break-word;
        overflow-wrap: break-word;
        line-height: 1.5;
        color: var(--text-color);
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
        font-family: var(--font-main), sans-serif;
        color: var(--heading-color);
    }

    a {
        color: var(--link-color);
        cursor: pointer;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }

    a strong {
        color: var(--link-color);
    }

    nav a {
        margin-right: 8px;
    }

    strong,
    b {
        color: var(--heading-color);
    }

    button {
        margin: 0;
        cursor: pointer;
    }

    time {
        font-family: monospace;
        font-style: normal;
        font-size: 15px;
    }

    main {
        line-height: 1.6;
    }

    table {
        width: 100%;
    }

    table, th, td {
        border: 1px dashed black;
        border-collapse: collapse;
        padding: 2px 4px;
    }

    hr {
        border: 0;
        border-top: 1px dashed;
    }

    img {
        max-width: 100%;
    }

    code {
        font-family: monospace;
        padding: 5px;
        border-radius: 5px;
        background-color: var(--code-color);
    }

    pre code {
        padding: 0;
        border-radius: 0;
        background-color: transparent;
    }

    blockquote {
        border-left: 4px solid #a3a3a3;
        color: var(--blockquote-color);
        padding-left: 15px;
        font-style: italic;
    }

    :root {
        --alert-note-color: #0969da;
        --alert-tip-color: #1a7f37;
        --alert-important-color: #8250df;
        --alert-warning-color: #9a6700;
        --alert-caution-color: #d1242f;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --alert-note-color: #4493f8;
            --alert-tip-color: #3fb950;
            --alert-important-color: #ab7df8;
            --alert-warning-color: #d29922;
            --alert-caution-color: #f85149;
        }
    }

    blockquote.alert {
        --alert-color: var(--alert-note-color);
        margin: 0 0 16px;
        padding: 8px 16px;
        border-left: 4px solid var(--alert-color);
        color: inherit;
        font-style: normal;
    }

    blockquote.alert > :first-child {
        margin-top: 0;
    }

    blockquote.alert > :last-child {
        margin-bottom: 0;
    }

    blockquote.alert .alert-heading {
        margin-bottom: 8px;
        font-weight: 500;
        line-height: 1;
        color: var(--alert-color);
    }

    blockquote.alert-tip { --alert-color: var(--alert-tip-color); }
    blockquote.alert-important { --alert-color: var(--alert-important-color); }
    blockquote.alert-warning { --alert-color: var(--alert-warning-color); }
    blockquote.alert-caution { --alert-color: var(--alert-caution-color); }

    footer {
        padding: 25px 0;
        text-align: center;
    }

    .title:hover {
        text-decoration: none;
    }

    .title h1 {
        font-size: 1.5em;
    }

    .inline {
        width: auto !important;
    }

    .highlight,
    .code {
        border-radius: 3px;
        margin-block-start: 1em;
        margin-block-end: 1em;
        overflow-x: auto;
    }

    .highlight pre,
    .code pre {
        min-width: 100%;
        width: max-content;
        margin: 0;
        padding: 8px 12px;
        box-sizing: border-box;
        border-radius: 0;
    }

    /* blog post list */
    ul.blog-posts {
        list-style-type: none;
        padding: unset;
    }

    ul.blog-posts li {
        display: flex;
    }

    ul.blog-posts li span {
        flex: 0 0 130px;
    }

    ul.blog-posts li a:visited {
        color: var(--visited-color);
    }
</style>
